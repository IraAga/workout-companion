<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" width="760" height="900" role="img" aria-labelledby="t a">
<title id="t">A · Pocket Log — shipped History</title>
<desc id="a">Shipped reference. Phone-first layout matching the shipped History screen: brand, History and Progress pills, title, Program/Session/Date selects, a left-aligned Start workout button, hairline session rows, and backup/sync accordions. The bottom navigation is the one proposed change, marked as such.</desc>
<rect width="760" height="900" fill="#E9EEE9"/>

<text x="470" y="78" font-family="'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#16201C">A · Pocket Log</text>
<text x="470" y="100" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#586660">History panel, as shipped · global nav cropped.</text>

<!-- device -->
<rect x="40" y="30" width="390" height="844" rx="30" fill="#FAFBFA" stroke="#D3DBD5" stroke-width="2"/>
<rect x="52" y="42" width="366" height="820" rx="22" fill="#F1F4F1"/>

<!-- status bar -->
<text x="72" y="66" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#16201C">9:41</text>
<g fill="#586660">
  <rect x="352" y="57" width="14" height="8" rx="1.5"/>
  <rect x="370" y="55" width="10" height="10" rx="2"/>
  <rect x="384" y="56" width="18" height="9" rx="3" fill="none" stroke="#586660" stroke-width="1.4"/>
  <rect x="387" y="59" width="11" height="3" rx="1"/>
</g>

<!-- brand -->
<text x="72" y="92" font-family="'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#16201C" letter-spacing=".01em">OFF-SEASON PLAN</text>

<!-- kicker -->
<text x="72" y="116" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8.5" font-weight="700" fill="#0C7557" letter-spacing="1.4">TRACK</text>

<!-- subtabs -->
<rect x="72" y="124" width="180" height="38" rx="4" fill="#FAFBFA" stroke="#D3DBD5"/>
<rect x="75" y="127" width="74" height="32" rx="3" fill="#0C7557"/>
<text x="112" y="148" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">History</text>
<text x="196" y="148" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#586660">Progress</text>

<!-- title -->
<text x="72" y="194" font-family="'Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="700" fill="#16201C" letter-spacing=".01em">HISTORY</text>

<!-- pickers: program + session row, date row -->
<g font-family="'Helvetica Neue',Arial,sans-serif">
  <text x="72" y="216" font-size="8" font-weight="700" fill="#586660" letter-spacing="1.1">PROGRAM</text>
  <text x="266" y="216" font-size="8" font-weight="700" fill="#586660" letter-spacing="1.1">SESSION</text>

  <rect x="72" y="222" width="180" height="40" rx="4" fill="#FAFBFA" stroke="#D3DBD5"/>
  <text x="84" y="247" font-size="11.5" fill="#16201C">Gym program</text>
  <path d="M230 238 l5 5 5-5" fill="none" stroke="#586660" stroke-width="1.5"/>

  <rect x="262" y="222" width="136" height="40" rx="4" fill="#FAFBFA" stroke="#D3DBD5"/>
  <text x="274" y="247" font-size="11.5" fill="#16201C">Lift A — Lower…</text>
  <path d="M378 238 l5 5 5-5" fill="none" stroke="#586660" stroke-width="1.5"/>

  <text x="72" y="280" font-size="8" font-weight="700" fill="#586660" letter-spacing="1.1">DATE</text>
  <rect x="72" y="286" width="136" height="40" rx="4" fill="#FAFBFA" stroke="#D3DBD5"/>
  <text x="84" y="311" font-size="11.5" fill="#16201C">16/11/2026</text>
  <rect x="184" y="298" width="11" height="12" rx="1.5" fill="none" stroke="#586660" stroke-width="1.3"/>
  <path d="M186 295 v4 M193 295 v4" stroke="#586660" stroke-width="1.3"/>
</g>

<!-- start -->
<rect x="72" y="340" width="133" height="44" rx="4" fill="#0C7557"/>
<text x="138" y="367" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">Start workout</text>

<!-- history rows -->
<g font-family="'Helvetica Neue',Arial,sans-serif">
  <line x1="72" y1="402" x2="398" y2="402" stroke="#D3DBD5"/>
  <g>
    <text x="72" y="426" font-size="17" font-weight="700" fill="#16201C" letter-spacing=".02em">NOV 15</text>
    <text x="176" y="420" font-size="12.5" font-weight="600" fill="#16201C">Lift A · Gym program</text>
    <text x="176" y="436" font-size="10.5" fill="#586660">3 exercises · 10 sets</text>
  </g>
  <line x1="72" y1="452" x2="398" y2="452" stroke="#D3DBD5"/>
  <text x="72" y="476" font-size="17" font-weight="700" fill="#16201C">NOV 13</text>
  <text x="176" y="470" font-size="12.5" font-weight="600" fill="#16201C">Lift B · Gym program</text>
  <text x="176" y="486" font-size="10.5" fill="#586660">2 exercises · 5 sets</text>
  <line x1="72" y1="502" x2="398" y2="502" stroke="#D3DBD5"/>
  <text x="72" y="526" font-size="17" font-weight="700" fill="#16201C">NOV 11</text>
  <text x="176" y="520" font-size="12.5" font-weight="600" fill="#16201C">Lift C · Gym program</text>
  <text x="176" y="536" font-size="10.5" fill="#586660">1 exercise · 3 sets</text>
  <line x1="72" y1="552" x2="398" y2="552" stroke="#D3DBD5"/>
  <text x="72" y="576" font-size="17" font-weight="700" fill="#16201C">NOV 9</text>
  <text x="176" y="570" font-size="12.5" font-weight="600" fill="#16201C">Progress entry</text>
  <text x="176" y="586" font-size="10.5" fill="#586660">1 exercise · 1 set</text>
  <line x1="72" y1="602" x2="398" y2="602" stroke="#D3DBD5"/>
  <text x="72" y="626" font-size="17" font-weight="700" fill="#16201C">NOV 5</text>
  <text x="176" y="620" font-size="12.5" font-weight="600" fill="#16201C">Progress entry</text>
  <text x="176" y="636" font-size="10.5" fill="#586660">1 exercise · 1 set</text>
  <line x1="72" y1="652" x2="398" y2="652" stroke="#D3DBD5"/>
</g>

<!-- accordions -->
<text x="72" y="680" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#0C7557" letter-spacing="1.1">BACKUP &amp; RESTORE</text>
<text x="72" y="704" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#0C7557" letter-spacing="1.1">SYNC</text>

<rect x="186" y="856" width="98" height="4" rx="2" fill="#C9D3CC"/>

<!-- callouts -->
<g font-family="'Helvetica Neue',Arial,sans-serif">
  <g stroke="#9FB3A8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="430" y1="144" x2="466" y2="144"/>
    <line x1="430" y1="252" x2="466" y2="252"/>
    <line x1="430" y1="430" x2="466" y2="430"/>
    <line x1="430" y1="690" x2="466" y2="690"/>
  </g>
  <g fill="#0C7557">
    <circle cx="466" cy="144" r="2.6"/><circle cx="466" cy="252" r="2.6"/>
    <circle cx="466" cy="430" r="2.6"/><circle cx="466" cy="690" r="2.6"/>
  </g>
  <text x="476" y="140" font-size="12.5" font-weight="700" fill="#16201C">Two pills, not a tab bar</text>
  <text x="476" y="156" font-size="11" fill="#586660">History is selected and is the only</text>
  <text x="476" y="170" font-size="11" fill="#586660">permanent list. Progress is its sibling.</text>

  <text x="476" y="248" font-size="12.5" font-weight="700" fill="#16201C">History is home</text>
  <text x="476" y="264" font-size="11" fill="#586660">Labeled Program / Session / Date</text>
  <text x="476" y="278" font-size="11" fill="#586660">selects and a left-aligned Start.</text>
  <text x="476" y="292" font-size="11" fill="#586660">No empty form on load.</text>

  <text x="476" y="426" font-size="12.5" font-weight="700" fill="#16201C">Hairline rows, real labels</text>
  <text x="476" y="442" font-size="11" fill="#586660">DATE in caps, then template · program</text>
  <text x="476" y="456" font-size="11" fill="#586660">and exercise/set counts. No cards.</text>

  <text x="476" y="686" font-size="12.5" font-weight="700" fill="#16201C">Device services are accordions</text>
  <text x="476" y="702" font-size="11" fill="#586660">Backup &amp; restore and Sync sit under</text>
  <text x="476" y="716" font-size="11" fill="#586660">the list, not in navigation.</text>

  <text x="476" y="788" font-size="12.5" font-weight="700" fill="#16201C">Navigation is cropped</text>
  <text x="476" y="804" font-size="11" fill="#586660">The shipped app navigates from a sticky</text>
  <text x="476" y="818" font-size="11" fill="#586660">top strip above the Track kicker.</text>
</g>
</svg>
