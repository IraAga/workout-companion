<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" width="760" height="900" role="img" aria-labelledby="t d">
<title id="t">D · Dashboard</title>
<desc id="d">Review-first phone layout. The week is the home screen: completion ring, a four-week consistency grid, a one-line strength trend, the next session and nutrition targets. Logging is one tap away.</desc>
