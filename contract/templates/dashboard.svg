  <text x="476" y="532" font-size="11" fill="#586660">Uses the R9 series (name-keyed top</text>
  <text x="476" y="546" font-size="11" fill="#586660">weight) without the full chart.</text>

  <text x="476" y="658" font-size="12.5" font-weight="700" fill="#16201C">One tap to the next session</text>
  <text x="476" y="674" font-size="11" fill="#586660">Start jumps straight into the</text>
  <text x="476" y="688" font-size="11" fill="#586660">template, skipping History.</text>

