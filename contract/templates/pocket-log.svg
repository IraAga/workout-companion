<text x="72" y="392" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#586660" letter-spacing="1.1">RECENT</text>
<g font-family="'Helvetica Neue',Arial,sans-serif">
  <rect x="72" y="404" width="338" height="62" rx="8" fill="#FAFBFA" stroke="#D3DBD5"/>
