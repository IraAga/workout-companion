<text x="324" y="212" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#586660">Progress</text>

<!-- start card -->
<rect x="72" y="240" width="338" height="122" rx="10" fill="#FAFBFA" stroke="#D3DBD5"/>
<text x="86" y="262" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#16201C">Gym · Lift A</text>
<text x="396" y="262" text-anchor="end" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#586660">Sun 15 Nov</text>
<g font-family="'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#16201C">
  <rect x="86" y="274" width="82" height="24" rx="5" fill="#F1F4F1" stroke="#D3DBD5"/>
  <text x="94" y="290">Gym</text>
  <path d="M152 284 l4 4 4-4" fill="none" stroke="#586660" stroke-width="1.4"/>
  <rect x="176" y="274" width="86" height="24" rx="5" fill="#F1F4F1" stroke="#D3DBD5"/>
  <text x="184" y="290">Lift A</text>
