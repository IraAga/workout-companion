<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" width="760" height="900" role="img" aria-labelledby="t a">
<title id="t">A · Pocket Log</title>
<desc id="a">Polished phone-first proposal. Keeps the shipped flow — History as home, Start workout, the workout opening below the strip — but restyles the controls and proposes four bottom destinations. Annotated callouts separate shipped behaviour from the restyle.</desc>
<rect width="760" height="900" fill="#E9EEE9"/>

<!-- annotation header -->
<text x="470" y="78" font-family="'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#16201C">A · Pocket Log</text>
<text x="470" y="100" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#586660">Restyle proposal · same flow, new chrome.</text>

<!-- device -->
<rect x="40" y="30" width="390" height="844" rx="30" fill="#FAFBFA" stroke="#D3DBD5" stroke-width="2"/>
<rect x="52" y="42" width="366" height="820" rx="22" fill="#F1F4F1"/>

<!-- status bar -->
<text x="72" y="66" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#16201C">9:41</text>
<g fill="#586660">
  <rect x="352" y="57" width="14" height="8" rx="1.5"/>
  <rect x="370" y="55" width="10" height="10" rx="2"/>
  <rect x="384" y="56" width="18" height="9" rx="3" fill="none" stroke="#586660" stroke-width="1.4"/>
  <rect x="387" y="59" width="11" height="3" rx="1"/>
</g>

<!-- header -->
<text x="72" y="106" font-family="'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#16201C" letter-spacing="-.2">Off-Season</text>
<text x="72" y="126" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#586660">Sunday, 15 November</text>

