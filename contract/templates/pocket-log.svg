<rect x="72" y="140" width="338" height="36" rx="8" fill="#DDEBE3"/>
<text x="86" y="163" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0C7557">2 of 3 lifts done</text>
<circle cx="360" cy="158" r="5" fill="#0C7557"/>
<circle cx="375" cy="158" r="5" fill="#0C7557"/>
<circle cx="390" cy="158" r="5" fill="#BCCBC2"/>

<!-- segmented -->
