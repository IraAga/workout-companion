  <path d="M392 431 l5 5-5 5" fill="none" stroke="#586660" stroke-width="1.6"/>

  <rect x="72" y="474" width="338" height="62" rx="8" fill="#FAFBFA" stroke="#D3DBD5"/>
  <text x="86" y="495" font-size="9" font-weight="700" fill="#0C7557" letter-spacing=".6">13 NOV</text>
  <text x="86" y="516" font-size="13" font-weight="600" fill="#16201C">Lift B</text>
  <text x="86" y="529" font-size="10.5" fill="#586660">6 exercises · 20 sets</text>
  <path d="M392 501 l5 5-5 5" fill="none" stroke="#586660" stroke-width="1.6"/>

  <rect x="72" y="544" width="338" height="62" rx="8" fill="#FAFBFA" stroke="#D3DBD5"/>
  <text x="86" y="565" font-size="9" font-weight="700" fill="#0C7557" letter-spacing=".6">11 NOV</text>
  <text x="86" y="586" font-size="13" font-weight="600" fill="#16201C">Lift C</text>
  <text x="86" y="599" font-size="10.5" fill="#586660">6 exercises · 18 sets</text>
  <path d="M392 571 l5 5-5 5" fill="none" stroke="#586660" stroke-width="1.6"/>

  <rect x="72" y="614" width="338" height="62" rx="8" fill="#FAFBFA" stroke="#D3DBD5"/>
  <text x="86" y="635" font-size="9" font-weight="700" fill="#586660" letter-spacing=".6">09 NOV</text>
  <text x="86" y="656" font-size="13" font-weight="600" fill="#16201C">Progress entry</text>
  <text x="86" y="669" font-size="10.5" fill="#586660">Trap Bar Deadlift · 1 set</text>
  <path d="M392 641 l5 5-5 5" fill="none" stroke="#586660" stroke-width="1.6"/>
</g>

<!-- proposed bottom nav -->
<rect x="60" y="756" width="350" height="76" rx="10" fill="#FAFBFA" stroke="#0C7557" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="328" y="744" width="82" height="18" rx="4" fill="#DDEBE3"/>
<text x="369" y="757" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="7.5" font-weight="700" fill="#0C7557" letter-spacing="1">PROPOSED</text>
<g font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" text-anchor="middle">
  <rect x="92" y="774" width="16" height="16" rx="4" fill="none" stroke="#586660" stroke-width="1.5"/>
  <text x="100" y="806" fill="#586660">Week</text>
  <rect x="186" y="774" width="16" height="16" rx="4" fill="#DDEBE3" stroke="#0C7557" stroke-width="1.5"/>
  <text x="194" y="806" fill="#0C7557" font-weight="700">Log</text>
  <rect x="278" y="774" width="16" height="16" rx="4" fill="none" stroke="#586660" stroke-width="1.5"/>
  <text x="286" y="806" fill="#586660">Train</text>
  <circle cx="376" cy="782" r="8" fill="none" stroke="#586660" stroke-width="1.5"/>
  <text x="376" y="806" fill="#586660">Eat</text>
</g>
<rect x="186" y="856" width="98" height="4" rx="2" fill="#C9D3CC"/>

<!-- callouts -->
<g font-family="'Helvetica Neue',Arial,sans-serif">
  <g stroke="#9FB3A8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="430" y1="158" x2="466" y2="158"/>
    <line x1="430" y1="210" x2="466" y2="210"/>
    <line x1="430" y1="330" x2="466" y2="330"/>
    <line x1="430" y1="500" x2="466" y2="500"/>
    <line x1="430" y1="792" x2="466" y2="792"/>
  </g>
  <g fill="#0C7557">
    <circle cx="466" cy="158" r="2.6"/><circle cx="466" cy="210" r="2.6"/>
    <circle cx="466" cy="330" r="2.6"/><circle cx="466" cy="500" r="2.6"/>
    <circle cx="466" cy="792" r="2.6"/>
  </g>
  <text x="476" y="154" font-size="12.5" font-weight="700" fill="#16201C">Week at a glance <tspan font-size="8.5" fill="#0C7557" letter-spacing=".8"> · NEW</tspan></text>
  <text x="476" y="170" font-size="11" fill="#586660">The shipped week count, surfaced on the</text>
  <text x="476" y="184" font-size="11" fill="#586660">log screen instead of only the Week tab.</text>

  <text x="476" y="206" font-size="12.5" font-weight="700" fill="#16201C">History is home</text>
  <text x="476" y="222" font-size="11" fill="#586660">No empty form on load. Pickers and</text>
  <text x="476" y="236" font-size="11" fill="#586660">Start live here.</text>

  <text x="476" y="326" font-size="12.5" font-weight="700" fill="#16201C">One primary action</text>
  <text x="476" y="342" font-size="11" fill="#586660">Start opens the workout below the</text>
  <text x="476" y="356" font-size="11" fill="#586660">strip. × discards, with a confirm.</text>

  <text x="476" y="496" font-size="12.5" font-weight="700" fill="#16201C">Dense, scannable history</text>
  <text x="476" y="512" font-size="11" fill="#586660">Date · template · exercises · sets.</text>
  <text x="476" y="526" font-size="11" fill="#586660">Tap to expand, edit or delete.</text>

  <text x="476" y="788" font-size="12.5" font-weight="700" fill="#16201C">Proposed: four destinations</text>
  <text x="476" y="804" font-size="11" fill="#586660">Dashed because the shipped app uses a</text>
  <text x="476" y="818" font-size="11" fill="#586660">9-link top strip. Shop folds into Eat.</text>
</g>
</svg>
