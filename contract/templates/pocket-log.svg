  <text x="278" y="290">15 Nov</text>
  <path d="M338 284 l4 4 4-4" fill="none" stroke="#586660" stroke-width="1.4"/>
</g>
<rect x="86" y="308" width="310" height="38" rx="7" fill="#0C7557"/>
<text x="241" y="332" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Start workout</text>

