<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" width="760" height="900" role="img" aria-labelledby="t d">
<title id="t">A · Pocket Log — workout view</title>
<desc id="d">Polished second state of the Pocket Log proposal: the workout opens below the strip with no tab selected, the template line carries context, cards hold the sets, and the save bar sits above the rest timer. The shipped reference version is kept separately.</desc>
<rect width="760" height="900" fill="#E9EEE9"/>

<text x="470" y="78" font-family="'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#16201C">A · Pocket Log</text>
<text x="470" y="100" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#586660">State 2 · the workout, open below the strip.</text>

<!-- device -->
<rect x="40" y="30" width="390" height="844" rx="30" fill="#FAFBFA" stroke="#D3DBD5" stroke-width="2"/>
<rect x="52" y="42" width="366" height="820" rx="22" fill="#F1F4F1"/>

<!-- status bar -->
<text x="72" y="66" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#16201C">9:41</text>
<g fill="#586660">
  <rect x="352" y="57" width="14" height="8" rx="1.5"/>
  <rect x="370" y="55" width="10" height="10" rx="2"/>
  <rect x="384" y="56" width="18" height="9" rx="3" fill="none" stroke="#586660" stroke-width="1.4"/>
  <rect x="387" y="59" width="11" height="3" rx="1"/>
</g>

<!-- kicker + strip, nothing selected -->
<text x="72" y="92" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#0C7557" letter-spacing="1.3">TRACK</text>
<rect x="72" y="102" width="326" height="32" rx="8" fill="#E4EAE5"/>
<text x="153" y="123" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#586660">History</text>
<text x="316" y="123" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#586660">Progress</text>
<line x1="225" y1="110" x2="225" y2="126" stroke="#CDD7D0"/>

<!-- heading row -->
<text x="72" y="176" font-family="'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#16201C" letter-spacing="-.2">Log workout</text>
<circle cx="396" cy="168" r="15" fill="#FAFBFA" stroke="#D3DBD5"/>
<path d="M390 162 l12 12 M402 162 l-12 12" stroke="#586660" stroke-width="1.7"/>

<!-- template + status -->
<text x="72" y="198" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#586660">Gym · Lift A · Sun 15 Nov</text>
<text x="72" y="214" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#9FB3A8">Saved on this device only · no account sync</text>

<!-- exercise card 1 -->
<rect x="72" y="228" width="326" height="252" rx="10" fill="#FAFBFA" stroke="#D3DBD5"/>
<text x="86" y="252" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#16201C">Trap Bar or Barbell Deadlift</text>
<path d="M378 246 l5 5-5 5" fill="none" stroke="#586660" stroke-width="1.5"/>
<text x="86" y="268" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#586660">Target 4×4 · Start 50–60 kg total</text>
<text x="86" y="283" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#9FB3A8">Last time (13 Nov): 60 kg × 4 · 60 kg × 4 · 57.5 kg × 4</text>

<g font-family="'Helvetica Neue',Arial,sans-serif" font-size="8.5" font-weight="700" fill="#9FB3A8" letter-spacing=".8">
  <text x="112" y="304">KG</text><text x="266" y="304">REPS</text>
</g>
<!-- set 1 -->
<circle cx="94" cy="322" r="10" fill="#0C7557"/>
<text x="94" y="326" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">✓</text>
<rect x="112" y="308" width="60" height="28" rx="5" fill="#FFFFFF" stroke="#D3DBD5"/>
<text x="142" y="326" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#16201C">60</text>
<rect x="266" y="308" width="52" height="28" rx="5" fill="#FFFFFF" stroke="#D3DBD5"/>
<text x="292" y="326" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#16201C">4</text>
<text x="384" y="327" text-anchor="end" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#9FB3A8">×</text>

<!-- set 2 -->
<circle cx="94" cy="360" r="10" fill="#0C7557"/>
<text x="94" y="364" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">✓</text>
<rect x="112" y="346" width="60" height="28" rx="5" fill="#FFFFFF" stroke="#D3DBD5"/>
<text x="142" y="364" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#16201C">60</text>
<rect x="266" y="346" width="52" height="28" rx="5" fill="#FFFFFF" stroke="#D3DBD5"/>
<text x="292" y="364" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#16201C">4</text>
<text x="384" y="365" text-anchor="end" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#9FB3A8">×</text>

<!-- set 3 -->
<circle cx="94" cy="398" r="10" fill="none" stroke="#D3DBD5" stroke-width="1.4"/>
<text x="94" y="402" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#586660">3</text>
<rect x="112" y="384" width="60" height="28" rx="5" fill="#FFFFFF" stroke="#D3DBD5"/>
<text x="142" y="400" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#9FB3A8">60</text>
<rect x="266" y="384" width="52" height="28" rx="5" fill="#FFFFFF" stroke="#D3DBD5"/>
<text x="292" y="400" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#9FB3A8">4</text>
<text x="384" y="403" text-anchor="end" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#9FB3A8">×</text>

<!-- set 4 -->
<circle cx="94" cy="436" r="10" fill="none" stroke="#D3DBD5" stroke-width="1.4"/>
<text x="94" y="440" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#586660">4</text>
<rect x="112" y="422" width="60" height="28" rx="5" fill="#FFFFFF" stroke="#D3DBD5"/>
<text x="142" y="438" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#9FB3A8">57.5</text>
<rect x="266" y="422" width="52" height="28" rx="5" fill="#FFFFFF" stroke="#D3DBD5"/>
<text x="292" y="438" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#9FB3A8">4</text>
<text x="384" y="441" text-anchor="end" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#9FB3A8">×</text>

<rect x="86" y="458" width="70" height="14" rx="4" fill="#F1F4F1"/>
<text x="121" y="468" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="600" fill="#0C7557">+ Add set</text>

<!-- collapsed card 2 -->
<rect x="72" y="490" width="326" height="64" rx="10" fill="#FAFBFA" stroke="#D3DBD5"/>
<text x="86" y="512" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#16201C">Box Jump</text>
<path d="M378 506 l5 5-5 5" fill="none" stroke="#586660" stroke-width="1.5"/>
<text x="86" y="528" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#586660">Target 4×4 · Bodyweight, 30–45 cm box</text>
<text x="86" y="542" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#9FB3A8">Last time: 4 · 4 · 4</text>

<!-- collapsed card 3 -->
<rect x="72" y="566" width="326" height="64" rx="10" fill="#FAFBFA" stroke="#D3DBD5"/>
<text x="86" y="588" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#16201C">Bulgarian Split Squat</text>
<path d="M378 582 l5 5-5 5" fill="none" stroke="#586660" stroke-width="1.5"/>
<text x="86" y="604" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#586660">Target 3×8/leg · Start 8–10 kg each hand</text>
<text x="86" y="618" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#9FB3A8">Last time: 10 kg × 8 · 10 kg × 8</text>

<!-- note -->
<text x="72" y="646" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#586660" letter-spacing=".8">SESSION NOTES</text>
<rect x="72" y="654" width="326" height="40" rx="7" fill="#FAFBFA" stroke="#D3DBD5"/>
<text x="84" y="670" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#9FB3A8">How it felt, any pain, what to change</text>
<text x="84" y="684" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#9FB3A8">next time</text>

<!-- save bar -->
<rect x="72" y="712" width="326" height="1" fill="#D3DBD5"/>
<text x="72" y="734" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#16201C">2 of 18 sets</text>
<text x="72" y="748" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#9FB3A8">Draft saved as you type</text>
<rect x="252" y="716" width="146" height="42" rx="8" fill="#0C7557"/>
<text x="325" y="742" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Save session</text>

<!-- rest -->
<rect x="72" y="764" width="326" height="46" rx="8" fill="#DDEBE3"/>
<text x="86" y="792" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#0C7557" letter-spacing="1">REST</text>
<text x="124" y="793" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#16201C">2:00</text>
<rect x="268" y="773" width="54" height="28" rx="5" fill="#FAFBFA" stroke="#BCCBC2"/>
<text x="295" y="791" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#16201C">+30 s</text>
<rect x="330" y="773" width="54" height="28" rx="5" fill="#FAFBFA" stroke="#BCCBC2"/>
<text x="357" y="791" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#16201C">Skip</text>

<rect x="186" y="856" width="98" height="4" rx="2" fill="#C9D3CC"/>

<!-- callouts -->
<g font-family="'Helvetica Neue',Arial,sans-serif">
  <g stroke="#9FB3A8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="430" y1="118" x2="466" y2="118"/>
    <line x1="430" y1="168" x2="466" y2="168"/>
    <line x1="430" y1="198" x2="466" y2="198"/>
    <line x1="430" y1="730" x2="466" y2="730"/>
  </g>
  <g fill="#0C7557">
    <circle cx="466" cy="118" r="2.6"/><circle cx="466" cy="168" r="2.6"/>
    <circle cx="466" cy="198" r="2.6"/><circle cx="466" cy="730" r="2.6"/>
  </g>
  <text x="476" y="114" font-size="12.5" font-weight="700" fill="#16201C">The strip stays, nothing is selected</text>
  <text x="476" y="130" font-size="11" fill="#586660">The workout is not a tab. History and</text>
  <text x="476" y="144" font-size="11" fill="#586660">Progress remain one tap away.</text>

  <text x="476" y="164" font-size="12.5" font-weight="700" fill="#16201C">× discards, never deletes</text>
  <text x="476" y="180" font-size="11" fill="#586660">Confirms only if a set or note was</text>
  <text x="476" y="194" font-size="11" fill="#586660">typed. During an edit it cancels.</text>

  <text x="476" y="230" font-size="12.5" font-weight="700" fill="#16201C">The template line is the context</text>
  <text x="476" y="246" font-size="11" fill="#586660">Program · session · date, because no</text>
  <text x="476" y="260" font-size="11" fill="#586660">tab is highlighting the state.</text>

  <text x="476" y="726" font-size="12.5" font-weight="700" fill="#16201C">Save is the only commit</text>
  <text x="476" y="742" font-size="11" fill="#586660">Drafts autosave to ol-drafts; only this</text>
  <text x="476" y="756" font-size="11" fill="#586660">writes a session and closes the view.</text>

  <text x="476" y="820" font-size="11" fill="#586660">Same screen on reload: History is shown,</text>
  <text x="476" y="836" font-size="11" fill="#586660">Start resumes the draft.</text>
</g>
</svg>
